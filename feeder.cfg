# =============================================================================
# feeder.cfg — Bowden feeder MCU, steppers, belay tensioners, and load macros
# =============================================================================
# Hardware overview:
#   - Separate "feeder" MCU drives 5 independent Bowden feeder steppers
#   - Each tool has a belay tensioner to compensate for filament slack/tension
#   - Physical unload buttons mounted at each feeder position
#   - filament_sensor_at_T{N} (toolhead) defined in tool{N}.cfg
#
# Only this file needs to be [include]d from printer.cfg — it pulls in
# feeder_macros.cfg and toolmap.cfg itself, so all three stay paired without
# extra lines in printer.cfg.
# =============================================================================

[include feeder_macros.cfg]
[include toolmap.cfg]


# -----------------------------------------------------------------------------
# MCU
# -----------------------------------------------------------------------------

[mcu feeder]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0


# -----------------------------------------------------------------------------
# Belay tensioners — compensate for filament slack between feeder and toolhead
# multiplier_high/low set the speed ratio bounds before belay intervenes
# -----------------------------------------------------------------------------

[belay tool0_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool0_feeder
sensor_pin: ^!feeder:PD3
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 1

[belay tool1_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool1_feeder
sensor_pin: ^!feeder:PJ0
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 1

[belay tool2_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool2_feeder
sensor_pin: ^!feeder:PJ1
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 1

[belay tool3_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool3_feeder
sensor_pin: ^!feeder:PE4
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 1

[belay tool4_belay]
extruder_type: extruder_stepper
extruder_stepper_name: _tool4_feeder
sensor_pin: ^!feeder:PE5
multiplier_high: 1.05
multiplier_low: 0.95
debug_level: 1


# -----------------------------------------------------------------------------
# Physical unload buttons — one per tool, mounted at the feeder box
# D=1400 should match your bowden tube length in mm
# -----------------------------------------------------------------------------

[gcode_button t0_unload_button]
pin: ^!feeder:PD2
press_gcode:
    UPDATE_DELAYED_GCODE ID=_t0_unload_debounce DURATION=0.5

[delayed_gcode _t0_unload_debounce]
gcode:
    UNLOAD_ANY_TOOL T=0 D=1400 S=30

[gcode_button t1_unload_button]
pin: ^!feeder:PK4
press_gcode:
    UPDATE_DELAYED_GCODE ID=_t1_unload_debounce DURATION=0.5

[delayed_gcode _t1_unload_debounce]
gcode:
    UNLOAD_ANY_TOOL T=1 D=1400 S=30

[gcode_button t2_unload_button]
pin: ^!feeder:PK7
press_gcode:
    UPDATE_DELAYED_GCODE ID=_t2_unload_debounce DURATION=0.5

[delayed_gcode _t2_unload_debounce]
gcode:
    UNLOAD_ANY_TOOL T=2 D=1400 S=30

[gcode_button t3_unload_button]
pin: ^!feeder:PK6
press_gcode:
    UPDATE_DELAYED_GCODE ID=_t3_unload_debounce DURATION=0.5

[delayed_gcode _t3_unload_debounce]
gcode:
    UNLOAD_ANY_TOOL T=3 D=1400 S=30

[gcode_button t4_unload_button]
pin: ^!feeder:PK5
press_gcode:
    UPDATE_DELAYED_GCODE ID=_t4_unload_debounce DURATION=0.5

[delayed_gcode _t4_unload_debounce]
gcode:
    UNLOAD_ANY_TOOL T=4 D=1400 S=30


# -----------------------------------------------------------------------------
# Feeder steppers — one BMG-style extruder stepper per tool
# rotation_distance tuned for 50:17 gear ratio on BMG
# -----------------------------------------------------------------------------

[extruder_stepper _tool0_feeder]
extruder: extruder
step_pin: feeder:PF0
dir_pin:  feeder:PF1
enable_pin: !feeder:PD7
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 22.319100012672

[tmc2208 extruder_stepper _tool0_feeder]
uart_pin: feeder:PG5
run_current: .5
hold_current: .05
stealthchop_threshold: 250

[extruder_stepper _tool1_feeder]
extruder: extruder1
step_pin: feeder:PF6
dir_pin: feeder:PF7
enable_pin: !feeder:PF2
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 22.319100012672

[tmc2208 extruder_stepper _tool1_feeder]
uart_pin: feeder:PE3
run_current: .5
hold_current: .05
stealthchop_threshold: 250

[extruder_stepper _tool2_feeder]
extruder: extruder2
step_pin: feeder:PL3
dir_pin:  feeder:PL1
enable_pin: !feeder:PK0
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 22.319100012672

[tmc2208 extruder_stepper _tool2_feeder]
uart_pin: feeder:PH3
run_current: .5
hold_current: .05
stealthchop_threshold: 250

[extruder_stepper _tool3_feeder]
extruder: extruder3
step_pin: feeder:PA4
dir_pin: !feeder:PA6
enable_pin: !feeder:PA2
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 22.319100012672

[tmc2208 extruder_stepper _tool3_feeder]
uart_pin: feeder:PB5
run_current: .5
hold_current: .05
stealthchop_threshold: 250

[extruder_stepper _tool4_feeder]
extruder: extruder4
step_pin: feeder:PC1
dir_pin: !feeder:PC3
enable_pin: !feeder:PC7
microsteps: 16
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 22.319100012672

[tmc2208 extruder_stepper _tool4_feeder]
uart_pin: feeder:PB6
run_current: .5
hold_current: .05
stealthchop_threshold: 250


# -----------------------------------------------------------------------------
# Feeder settings — shared by all load/unload macros (feeder_macros.cfg)
#
# This is the ONLY place bucket position, temps, and tuning live. Edit these
# to match your setup. feeder_macros.cfg contains no hardware- or
# setup-specific values, so it's safe to overwrite/update on its own without
# touching anything you've tuned here.
# -----------------------------------------------------------------------------

[gcode_macro _FEEDER_VARS]
variable_bucket_x:        25  # X position of purge bucket
variable_bucket_y:        -4  # Y position of purge bucket
variable_load_temp:      220  # temperature to load/unload/purge at
variable_load_purge:     150  # mm to purge after filament reaches toolhead (load macros)
variable_unload_purge:   100  # mm to retract after tip shaping to clear the nozzle
variable_feed_step:       10  # step size passed to _FILAMENT_FEED loop (mm)
variable_wiggle_init:     10  # initial retract before oscillating (mm)
variable_wiggle_dist:      5  # push/pull oscillation distance (mm)
variable_wiggle_passes:    3  # number of oscillation cycles
variable_wiggle_speed:   500  # feedrate for wiggle moves (mm/min, ~8mm/s)
variable_tip_slow_dist:    5  # mm to retract slowly to form the tip
variable_tip_slow_speed: 300  # F value for slow phase (~5mm/s)
variable_tip_fast_dist:   40  # mm to retract fast to escape the heatbreak zone
variable_tip_fast_speed: 3600 # F value for fast phase (~60mm/s)
variable_spoolman_enabled: True  # set False if you don't run Moonraker/Spoolman — skips SET_ACTIVE_SPOOL in _TOOL_ROUTER
gcode: