# turtleneck_buffer_example.cfg
# Example config for a 5-tool printer (Bobby) using turtleneck_buffer.py.
#
# Install:
#   1. Copy turtleneck_buffer.py to klippy/extras/
#   2. Add the [turtleneck_buffer] sections below to your printer.cfg
#      (or [include turtleneck_buffer.cfg] if you split configs)
#   3. Remove / comment out any existing [belay] and BTT filament sensor sections
#   4. RESTART Klipper
#
# One [turtleneck_buffer <name>] section per tool.
# The <name> is used as the BUFFER= parameter in all GCode commands.
#
# Each tool picks its sensor hardware via sensor_mode (default: dual). Tools
# with TurtleNeck two-sensor buffers and tools with a Belay-style single
# sensor can be mixed in the same printer.cfg / same module install — see
# Tool 4 below for the single-sensor example.

# -----------------------------------------------------------------------------
# Tool 0
# -----------------------------------------------------------------------------
[turtleneck_buffer T0]
sensor_mode:  dual              # optional (default) — TurtleNeck two-sensor buffer
advance_pin:  ^feeder:PA1       # required — active when buffer is fully expanded
trailing_pin: ^feeder:PA2       # required — active when buffer is fully compressed
extruder_stepper: _tool0_feeder # required — extruder_stepper object name
multiplier_high: 1.05           # optional (default 1.05) — slows feeder, compresses buffer
multiplier_low:  0.95           # optional (default 0.95) — speeds feeder, expands buffer
filament_error_sensitivity: 5   # optional (default 0 = disabled)
                                # 1 = least sensitive (fault after 100 mm), 10 = most (10 mm)
                                # formula: fault_distance = (11 - sensitivity) * 10 mm

# -----------------------------------------------------------------------------
# Tool 1
# -----------------------------------------------------------------------------
[turtleneck_buffer T1]
advance_pin:  ^feeder:PA3
trailing_pin: ^feeder:PA4
extruder_stepper: _tool1_feeder
multiplier_high: 1.05
multiplier_low:  0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 2
# -----------------------------------------------------------------------------
[turtleneck_buffer T2]
advance_pin:  ^feeder:PB1
trailing_pin: ^feeder:PB2
extruder_stepper: _tool2_feeder
multiplier_high: 1.05
multiplier_low:  0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 3
# -----------------------------------------------------------------------------
[turtleneck_buffer T3]
advance_pin:  ^feeder:PB3
trailing_pin: ^feeder:PB4
extruder_stepper: _tool3_feeder
multiplier_high: 1.05
multiplier_low:  0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 4 — Belay-compatible single-sensor buffer (see CREDITS.md)
# -----------------------------------------------------------------------------
# Use this form for a tool that currently runs the actual Belay module: same
# physical sensor and wiring, just point sensor_pin at whatever pin the old
# [belay] section used. No jam detection in this mode (Belay doesn't have
# it either) — filament_error_sensitivity is not a valid option here and
# Klipper will refuse to start if it's left in by mistake.
[turtleneck_buffer T4]
sensor_mode: single             # required — selects the single-sensor class
sensor_pin:  ^feeder:PC1        # required — same pin/wiring as the old [belay] section
invert_sensor: False            # optional (default False) — flip if wiring reads backwards
extruder_stepper: _tool4_feeder
multiplier_high: 1.05           # optional (default 1.05) — matches Belay's default
multiplier_low:  0.95           # optional (default 0.95) — matches Belay's default

# -----------------------------------------------------------------------------
# Jam macro (optional override)
# -----------------------------------------------------------------------------
# The module provides a built-in default that responds with a message and calls
# PAUSE.  Define this macro in your config only if you want different behaviour.
# The TOOL and SENSOR parameters are always passed by the module.
#
# SENSOR values:
#   advance  — buffer kept expanding but never compressed → downstream clog
#   trailing — buffer kept compressing but never expanded → upstream feed problem
#
#[gcode_macro TURTLENECK_JAM]
#description: Override of the default turtleneck_buffer jam handler
#gcode:
#    {action_respond_info("Jam on tool %s (sensor: %s)" % (params.TOOL, params.SENSOR))}
#    SET_LED LED=status RED=1 GREEN=0 BLUE=0   # optional visual alert
#    PAUSE

# -----------------------------------------------------------------------------
# GCode command reference
# -----------------------------------------------------------------------------
# QUERY_BUFFER BUFFER=T0
#   → Reports current state (neutral/advancing/trailing) and rotation_distance
#
# SET_ROTATION_FACTOR BUFFER=T0 FACTOR=1.02
#   → Directly applies a one-off rotation factor (does not change stored multipliers)
#
# SET_BUFFER_MULTIPLIER BUFFER=T0 MULTIPLIER=HIGH FACTOR=1.08
# SET_BUFFER_MULTIPLIER BUFFER=T0 MULTIPLIER=LOW  FACTOR=0.92
#   → Live-adjusts multiplier_high or multiplier_low without restarting Klipper
