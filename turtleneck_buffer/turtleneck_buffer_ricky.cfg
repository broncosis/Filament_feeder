# turtleneck_buffer_ricky.cfg
# turtleneck_buffer config for Ricky — 6-tool printer, BTT Octopus feeder MCU.
#
# Sensor wiring: TurtleNeck advance/trailing switches → EXP1 + EXP2 ports.
# No LCD is connected to these ports so all data pins are free to use.
#
# Verify pin assignments against your physical wiring before first boot.
#
# Install:
#   1. Copy turtleneck_buffer.py to klippy/extras/
#   2. Add [include turtleneck_buffer_ricky.cfg] to printer.cfg
#   3. RESTART Klipper

# -----------------------------------------------------------------------------
# EXP port GPIO reference — BTT Octopus
# -----------------------------------------------------------------------------
# EXP1 (8 data pins used for T0–T3):
#   Pin 1 BEEP  → PE8    Pin 2 ENC   → PE7
#   Pin 3 EN    → PE9    Pin 4 RS    → PE10
#   Pin 5 D4    → PE12   Pin 6 D5    → PE13
#   Pin 7 D6    → PE14   Pin 8 D7    → PE15
#
# EXP2 (4 data pins used for T4–T5; SPI pins safe to use when no SPI LCD fitted):
#   Pin 1 MISO  → PA6    Pin 2 SCK   → PA5
#   Pin 3 EN1   → PB2    Pin 5 EN2   → PB1
#   (Pin 8 is MCU RESET — never connect a sensor here)

# -----------------------------------------------------------------------------
# Tool 0  —  EXP1 pins 1 & 2  (PE8 / PE7)
# -----------------------------------------------------------------------------
[turtleneck_buffer T0]
advance_pin:      ^feeder:PE8
trailing_pin:     ^feeder:PE7
extruder_stepper: _tool0_feeder
multiplier_high:  1.05
multiplier_low:   0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 1  —  EXP1 pins 3 & 4  (PE9 / PE10)
# -----------------------------------------------------------------------------
[turtleneck_buffer T1]
advance_pin:      ^feeder:PE9
trailing_pin:     ^feeder:PE10
extruder_stepper: _tool1_feeder
multiplier_high:  1.05
multiplier_low:   0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 2  —  EXP1 pins 5 & 6  (PE12 / PE13)
# -----------------------------------------------------------------------------
[turtleneck_buffer T2]
advance_pin:      ^feeder:PE12
trailing_pin:     ^feeder:PE13
extruder_stepper: _tool2_feeder
multiplier_high:  1.05
multiplier_low:   0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 3  —  EXP1 pins 7 & 8  (PE14 / PE15)
# -----------------------------------------------------------------------------
[turtleneck_buffer T3]
advance_pin:      ^feeder:PE14
trailing_pin:     ^feeder:PE15
extruder_stepper: _tool3_feeder
multiplier_high:  1.05
multiplier_low:   0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 4  —  EXP2 pins 1 & 2  (PA6 / PA5)
# -----------------------------------------------------------------------------
[turtleneck_buffer T4]
advance_pin:      ^feeder:PA6
trailing_pin:     ^feeder:PA5
extruder_stepper: _tool4_feeder
multiplier_high:  1.05
multiplier_low:   0.95
filament_error_sensitivity: 5

# -----------------------------------------------------------------------------
# Tool 5  —  EXP2 pins 3 & 5  (PB2 / PB1)
# -----------------------------------------------------------------------------
[turtleneck_buffer T5]
advance_pin:      ^feeder:PB2
trailing_pin:     ^feeder:PB1
extruder_stepper: _tool5_feeder
multiplier_high:  1.05
multiplier_low:   0.95
filament_error_sensitivity: 5

